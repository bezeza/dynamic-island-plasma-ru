<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="How Dynamic Island sits in the Plasma session">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6E6E76"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0A84FF"/>
    </marker>
    <style>
      .bg    { fill: #0B0B0D; }
      .card  { fill: #141418; stroke: #2A2A31; stroke-width: 1; }
      .pill  { fill: #000000; stroke: #33333B; stroke-width: 1; }
      .title { fill: #F5F5F7; font: 600 15px "DejaVu Sans", sans-serif; }
      .body  { fill: #9A9AA2; font: 12px "DejaVu Sans", sans-serif; }
      .tag   { fill: #0A84FF; font: 600 11px "DejaVu Sans", sans-serif; letter-spacing: 0.08em; }
      .wire  { stroke: #6E6E76; stroke-width: 1.6; fill: none; }
      .wireA { stroke: #0A84FF; stroke-width: 1.8; fill: none; }
      .label { fill: #6E6E76; font: 11px "DejaVu Sans", sans-serif; }
      .labelA{ fill: #0A84FF; font: 11px "DejaVu Sans", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="880" height="470" rx="14"/>

  <!-- senders -->
  <rect class="card" x="30" y="40" width="180" height="104" rx="12"/>
  <text class="tag"   x="50" y="68">APPLICATIONS</text>
  <text class="title" x="50" y="94">Firefox, Element,</text>
  <text class="title" x="50" y="114">notify-send, …</text>
  <text class="body"  x="50" y="136">Notify() over the session bus</text>

  <!-- things the island only listens to -->
  <rect class="card" x="30" y="166" width="180" height="120" rx="12"/>
  <text class="tag"   x="50" y="194">LISTENED TO</text>
  <text class="title" x="50" y="220">Volume, brightness</text>
  <text class="body"  x="50" y="242">org.kde.osdService</text>
  <text class="title" x="50" y="264">Players over MPRIS</text>
  <text class="body"  x="50" y="282">title, cover, controls</text>

  <!-- the island -->
  <rect x="330" y="26" width="230" height="60" rx="24" fill="url(#glow)"/>
  <rect class="pill"  x="345" y="34" width="200" height="44" rx="22"/>
  <circle cx="371" cy="56" r="9" fill="#FF7139"/>
  <rect x="390" y="46" width="70" height="7" rx="3.5" fill="#F5F5F7" opacity="0.9"/>
  <rect x="390" y="60" width="110" height="6" rx="3" fill="#9A9AA2" opacity="0.7"/>

  <rect class="card" x="310" y="104" width="270" height="150" rx="12"/>
  <text class="tag"   x="330" y="132">DYNAMIC ISLAND</text>
  <text class="title" x="330" y="158">Owns org.freedesktop.</text>
  <text class="title" x="330" y="178">Notifications</text>
  <text class="body"  x="330" y="202">Draws on a wlr-layer-shell surface,</text>
  <text class="body"  x="330" y="220">derives the accent from the app icon,</text>
  <text class="body"  x="330" y="238">forwards actions and inline replies back.</text>

  <!-- history file -->
  <rect class="card" x="310" y="290" width="270" height="96" rx="12"/>
  <text class="tag"   x="330" y="318">ON DISK</text>
  <text class="title" x="330" y="344">history.json</text>
  <text class="body"  x="330" y="366">~/.local/share/dynamic-island/</text>

  <!-- panel applet -->
  <rect class="card" x="660" y="290" width="190" height="96" rx="12"/>
  <text class="tag"   x="680" y="318">PANEL APPLET</text>
  <text class="title" x="680" y="344">History</text>
  <text class="body"  x="680" y="366">reads the file, asks</text>
  <text class="body"  x="680" y="382">the island to clear it</text>

  <!-- plasmashell lane -->
  <rect class="card" x="660" y="104" width="190" height="150" rx="12"/>
  <text class="tag"   x="680" y="132">FILE OPERATIONS</text>
  <text class="title" x="680" y="158">Copy, move, delete</text>
  <text class="body"  x="680" y="182">org.kde.JobViewServer</text>
  <text class="body"  x="680" y="204">is ours too, so progress,</text>
  <text class="body"  x="680" y="222">pause and cancel land</text>
  <text class="body"  x="680" y="240">in the island as well.</text>

  <!-- wires -->
  <path class="wireA" d="M 210 92 L 300 110" marker-end="url(#arrowAccent)"/>
  <text class="labelA" x="216" y="86">Notify()</text>

  <path class="wire" d="M 210 226 L 300 196" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
  <text class="label" x="216" y="238">watched, not taken</text>

  <path class="wire" d="M 445 254 L 445 282" marker-end="url(#arrow)"/>
  <text class="label" x="375" y="276">dismissed</text>

  <path class="wire" d="M 580 338 L 650 338" marker-end="url(#arrow)"/>
  <text class="label" x="584" y="330">read</text>

  <path class="wire" d="M 755 290 L 755 268 L 470 268 L 470 258" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
  <text class="label" x="600" y="262">ClearHistory() over D-Bus</text>

  <path class="wireA" d="M 120 286 L 120 434 L 615 434 L 615 200 L 650 200"
        marker-end="url(#arrowAccent)" stroke-dasharray="4 4" opacity="0.65"/>
  <text class="labelA" x="140" y="428">file managers report progress here</text>

  <path class="wire" d="M 660 178 L 585 178" marker-end="url(#arrow)"/>
  <text class="label" x="590" y="170">shown as a card</text>
</svg>
